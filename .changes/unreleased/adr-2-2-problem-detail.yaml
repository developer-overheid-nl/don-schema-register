kind: Fixed
body: Foutresponses (application/problem+json) bevatten nu altijd een detail-veld, het raw-schema-endpoint geeft fouten als application/problem+json terug en de OpenAPI-specificatie documenteert 400-responses voor GET /schemas/{id} en GET /schemas/{id}/schema.json, zodat de spec voldoet aan ADR 2.2.0.
time: 2026-10-13T14:26:17+02:00
