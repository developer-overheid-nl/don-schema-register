developmentStatus: concept

description:
  nl:
    shortDescription: >-
      API van het Schema register (schemas.developer.overheid.nl)
    longDescription: |
      De API van het Schema-register maakt JSON Schemas van de overheid beter
      vindbaar en herbruikbaar. Via deze API kunnen organisaties, ontwikkelaars en
      dienstverleners actuele metadata over JSON Schemas ophalen en verwerken in
      eigen toepassingen.
    features:
      - Doorzoekbare catalogus van JSON Schemas

