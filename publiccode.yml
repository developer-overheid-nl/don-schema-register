publiccodeYmlVersion: "0.5.0"

name: API van het Schema register
url: "https://github.com/developer-overheid-nl/don-schema-register"
landingURL: "https://schemas.developer.overheid.nl"
softwareType: standalone/web
platforms:
  - web

categories:
